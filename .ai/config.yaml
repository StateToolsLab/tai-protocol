# tai Claude Code / Git adapter defaults
# Ownerが承認したPolicyの既定値。実効Policy・承認・版はTask本文とRecovery Stateに記録する。
# この設定だけでGateや予算を自動強制するものではない。

# 通知先のSupervisorセッション。運用ではSUPERVISOR_SESSION環境変数を優先する。
# ライブのIDや資格情報を配布物へcommitしない。
supervisor_session:

# .claude/skills/tai/references/protocol.md のPreset。
# MANUAL | TASK_BOUNDARY | GIT_BOUNDARY | AUTONOMOUS_UNTIL_ARBITRATION
# 接続の自動化と承認の自動化は別。アップグレードでは自動化範囲を変えない。
default_autonomy: TASK_BOUNDARY
